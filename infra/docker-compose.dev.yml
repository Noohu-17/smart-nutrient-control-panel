# Local development stack: PostgreSQL with TimescaleDB, the Mosquitto MQTT broker,
# and the FastAPI back end (backend/).
#
# DEV ONLY. MQTT has no TLS and no passwords, and the database uses a default password.
# Staging uses per-device MQTT accounts and ACLs (contract sections 3 and 4).
# All ports are bound to 127.0.0.1, so nothing is reachable from the network.
#
# Run from the repo root:
#   docker compose -f infra/docker-compose.dev.yml up -d --build   start (rebuilds the api image)
#   docker compose -f infra/docker-compose.dev.yml ps              every service should be "healthy"
#   curl http://localhost:8000/api/health                           {"status":"OK","database":"UP","broker":"UP"}
#   docker compose -f infra/docker-compose.dev.yml exec api alembic upgrade head    build or update the database
#   docker compose -f infra/docker-compose.dev.yml exec api python -m app.db.seed   load the client's layout.json
#   docker compose -f infra/docker-compose.dev.yml down            stop (add -v to also delete the database)
#
# The simulator usually runs on the laptop (simulator/readme.md). To run it here instead, add
# --profile sim; never both at once, or two copies of each device share one MQTT client ID.
# Either way its playground control API (contract 11.4) is on http://127.0.0.1:8100.
#
# Defaults can be overridden with environment variables or an infra/.env file:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_PORT, MQTT_PORT, API_PORT,
#   SIM_CONTROL_PORT, SIM_SPEED,
#   CLIENT (the config pack under config/clients/ that the api reads; default client_A)

name: sna-dev

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sna-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-sna}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ../backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-sna}
      DB_USER: ${POSTGRES_USER:-sna}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sna-dev-only}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      CLIENT_DIR: /config/clients/${CLIENT:-client_A}
      # /api/sim forwards here (contract 11.4): the simulator below, with --profile sim
      SIM_CONTROL_URL: ${SIM_CONTROL_URL:-http://simulator:8100}
    volumes:
      - ../config:/config:ro  # the client config packs (contract 2.5), read only
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Stores what the farm sends (backend/README.md). Until `alembic upgrade head` has run it
  # logs "database not ready" and waits. It has no port, so `ps` shows it as just "running".
  worker:
    build: ../backend
    command: ["python", "-m", "app.worker.main"]
    stop_signal: SIGINT  # stops at once; as PID 1, Python would ignore Docker's default SIGTERM
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-sna}
      DB_USER: ${POSTGRES_USER:-sna}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sna-dev-only}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      CLIENT_DIR: /config/clients/${CLIENT:-client_A}
    volumes:
      - ../config:/config:ro
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  # The farm simulator, only with --profile sim. Its control API is for the back end alone
  # (contract 11.4): published on 127.0.0.1, so only this machine reaches it.
  simulator:
    build: ../simulator
    profiles: [sim]
    stop_signal: SIGINT  # a clean stop: each device publishes its own offline status
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      SIM_SPEED: ${SIM_SPEED:-}  # empty: the demo's speed (simulator.json demoStart.speed)
      SIM_CLIENT_DIR: /config/clients/${CLIENT:-client_A}
      SIM_CONTROL_HOST: 0.0.0.0  # inside the container; the port below is this machine's only
      SIM_CONTROL_PORT: "8100"
    volumes:
      - ../config:/config:ro
      - sim-state:/app/.state  # bootIds must keep rising across restarts (contract 5)
    ports:
      - "127.0.0.1:${SIM_CONTROL_PORT:-8100}:8100"
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  sim-state:
