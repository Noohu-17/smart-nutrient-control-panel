# Broker permissions for the staging site, siet-ph1 (contract 4). A client's site gets its own
# copy when it is commissioned. Anything not listed here is refused.

user ZC1
topic write farm/siet-ph1/zone/Z1/telemetry
topic write farm/siet-ph1/zone/Z1/state
topic write farm/siet-ph1/zone/Z1/event
topic write farm/siet-ph1/zone/Z1/cmd/state
topic write farm/siet-ph1/device/ZC1/status
topic read farm/siet-ph1/zone/Z1/cmd
topic read farm/siet-ph1/stop
topic read farm/siet-ph1/device/ZC1/config

user ZC2
topic write farm/siet-ph1/zone/Z2/telemetry
topic write farm/siet-ph1/zone/Z2/state
topic write farm/siet-ph1/zone/Z2/event
topic write farm/siet-ph1/zone/Z2/cmd/state
topic write farm/siet-ph1/device/ZC2/status
topic read farm/siet-ph1/zone/Z2/cmd
topic read farm/siet-ph1/stop
topic read farm/siet-ph1/device/ZC2/config

user CC1
topic write farm/siet-ph1/climate/telemetry
topic write farm/siet-ph1/climate/state
topic write farm/siet-ph1/climate/event
topic write farm/siet-ph1/climate/cmd/state
topic write farm/siet-ph1/device/CC1/status
topic read farm/siet-ph1/climate/cmd
topic read farm/siet-ph1/stop
topic read farm/siet-ph1/device/CC1/config

user PM1
topic write farm/siet-ph1/power/state
topic write farm/siet-ph1/device/PM1/status

# The gateway relays for the devices above (contract 4, 10): exactly what they publish, plus its
# own status and journal, and exactly what the cloud sends them. No wildcards, so it can't
# publish for a zone or device that isn't here. It may subscribe with wildcards, but the broker
# gives it only the topics it may read.
user GW1
topic write farm/siet-ph1/zone/Z1/telemetry
topic write farm/siet-ph1/zone/Z1/state
topic write farm/siet-ph1/zone/Z1/event
topic write farm/siet-ph1/zone/Z1/cmd/state
topic write farm/siet-ph1/zone/Z2/telemetry
topic write farm/siet-ph1/zone/Z2/state
topic write farm/siet-ph1/zone/Z2/event
topic write farm/siet-ph1/zone/Z2/cmd/state
topic write farm/siet-ph1/climate/telemetry
topic write farm/siet-ph1/climate/state
topic write farm/siet-ph1/climate/event
topic write farm/siet-ph1/climate/cmd/state
topic write farm/siet-ph1/power/state
topic write farm/siet-ph1/device/ZC1/status
topic write farm/siet-ph1/device/ZC2/status
topic write farm/siet-ph1/device/CC1/status
topic write farm/siet-ph1/device/PM1/status
topic write farm/siet-ph1/device/GW1/status
topic write farm/siet-ph1/gateway/journal
topic read farm/siet-ph1/zone/Z1/cmd
topic read farm/siet-ph1/zone/Z2/cmd
topic read farm/siet-ph1/climate/cmd
topic read farm/siet-ph1/stop
topic read farm/siet-ph1/device/ZC1/config
topic read farm/siet-ph1/device/ZC2/config
topic read farm/siet-ph1/device/CC1/config

user CLOUD-api
topic write farm/siet-ph1/zone/+/cmd
topic write farm/siet-ph1/climate/cmd
topic write farm/siet-ph1/stop
topic write farm/siet-ph1/device/+/config
topic read farm/siet-ph1/#

# The worker only stores what the farm sends, so it may only read.
user CLOUD-worker
topic read farm/siet-ph1/#
