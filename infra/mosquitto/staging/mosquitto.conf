# Mosquitto for the staging stack (infra/docker-compose.staging.yml), started by start.sh.
#
# 1883: plain MQTT, never published. Only containers on the internal network reach it: the API,
#       the worker and the simulator (contract 3). Every account.
# 8883: MQTT over TLS for the farm's gateway, published by the compose file. Only the real
#       devices' logins from secrets/passwords (add-device-login.sh). start.sh writes this listener into /tmp/mosquitto-listeners when the broker's
#       certificate is in secrets/ (infra/readme.md).
#
# Both listeners use the same ACL: /tmp/mosquitto-acl.conf, which start.sh writes from the site's
# acl file (MQTT_ACL) and, for the prototype rig, its two sf/* accounts. Every client logs in with
# its own account.

per_listener_settings true

# The largest MQTT packet the broker accepts: 64 KB, four times the contract's 16 KB message limit
# (contract 3). A client that sends a larger one is disconnected. It is there for 8883, which faces
# the internet, but Mosquitto applies it to every listener, per_listener_settings or not.
max_packet_size 65536

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous false
password_file /tmp/mosquitto-passwords
acl_file /tmp/mosquitto-acl.conf

include_dir /tmp/mosquitto-listeners
