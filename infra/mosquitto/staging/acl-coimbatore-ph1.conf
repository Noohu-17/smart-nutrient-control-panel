# Broker permissions for client_B's site, coimbatore-ph1 (contract 4): the same blocks as
# acl.conf, for this site. Chosen with MQTT_ACL=acl-coimbatore-ph1.conf in infra/.env.staging.
# No GW1: client_B's farm link is the prototype rig's own gateway, on its sf/* topics, and start.sh
# adds its block and the zone controller service's (RIGLINK) from RIG_TELEMETRY_TOPIC and
# RIG_COMMAND_TOPIC, which stay out of git. Anything not listed is refused.

user ZC1
topic write farm/coimbatore-ph1/zone/Z1/telemetry
topic write farm/coimbatore-ph1/zone/Z1/state
topic write farm/coimbatore-ph1/zone/Z1/event
topic write farm/coimbatore-ph1/zone/Z1/cmd/state
topic write farm/coimbatore-ph1/device/ZC1/status
topic read farm/coimbatore-ph1/zone/Z1/cmd
topic read farm/coimbatore-ph1/stop
topic read farm/coimbatore-ph1/device/ZC1/config

user ZC2
topic write farm/coimbatore-ph1/zone/Z2/telemetry
topic write farm/coimbatore-ph1/zone/Z2/state
topic write farm/coimbatore-ph1/zone/Z2/event
topic write farm/coimbatore-ph1/zone/Z2/cmd/state
topic write farm/coimbatore-ph1/device/ZC2/status
topic read farm/coimbatore-ph1/zone/Z2/cmd
topic read farm/coimbatore-ph1/stop
topic read farm/coimbatore-ph1/device/ZC2/config

user CC1
topic write farm/coimbatore-ph1/climate/telemetry
topic write farm/coimbatore-ph1/climate/state
topic write farm/coimbatore-ph1/climate/event
topic write farm/coimbatore-ph1/climate/cmd/state
topic write farm/coimbatore-ph1/device/CC1/status
topic read farm/coimbatore-ph1/climate/cmd
topic read farm/coimbatore-ph1/stop
topic read farm/coimbatore-ph1/device/CC1/config

user PM1
topic write farm/coimbatore-ph1/power/state
topic write farm/coimbatore-ph1/device/PM1/status

user CLOUD-api
topic write farm/coimbatore-ph1/zone/+/cmd
topic write farm/coimbatore-ph1/climate/cmd
topic write farm/coimbatore-ph1/stop
topic write farm/coimbatore-ph1/device/+/config
topic read farm/coimbatore-ph1/#

# The worker only stores what the farm sends, so it may only read.
user CLOUD-worker
topic read farm/coimbatore-ph1/#
